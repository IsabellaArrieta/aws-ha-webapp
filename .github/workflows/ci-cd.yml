name: CI/CD Pipeline Alta Disponibilidad

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  pull-requests: write

env:
  AWS_REGION: "us-east-1"

jobs:
  # ─── JOB 1: VALIDATE ──────────────────────────────────────────────
  validate:
    name: Terraform Validate & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Instalar TFLint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: latest

      - name: Terraform Init (Backend local temporal)
        run: terraform init -backend=false
        working-directory: ./terraform

      - name: Terraform Fmt
        run: terraform fmt -check
        working-directory: ./terraform

      - name: Terraform Validate
        run: terraform validate
        working-directory: ./terraform

      - name: Run TFLint
        run: tflint
        working-directory: ./terraform

  # ─── JOB 2: PLAN ──────────────────────────────────────────────────
  plan:
    name: Terraform Plan
    needs: validate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configurar Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init
        working-directory: ./terraform

      - name: Terraform Plan
        id: plan
        run: terraform plan -no-color -out=tfplan
        working-directory: ./terraform

      - name: Comentar PR con el Plan
        uses: actions/github-script@v7
        env:
          PLAN: "terraform\n${{ steps.plan.outputs.stdout }}"
        with:
          script: |
            const output = `#### Terraform Plan 📖
            <details><summary>Mostrar Plan</summary>
            
            \`\`\`\n
            ${process.env.PLAN}
            \`\`\`
            
            </details>`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            })

  # ─── JOB 3: APPLY ─────────────────────────────────────────────────
  apply:
    name: Terraform Apply
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production # Requerido para la aprobación manual en GitHub
    steps:
      - uses: actions/checkout@v4

      - name: Configurar AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configurar Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init
        working-directory: ./terraform

      - name: Terraform Apply
        run: terraform apply -auto-approve
        working-directory: ./terraform

# ─── JOB 4: CONFIGURE ─────────────────────────────────────────────
  configure:
    name: Ansible Post-Deploy
    needs: apply
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configurar llave SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/p01-webha-key
          chmod 600 ~/.ssh/p01-webha-key

      - name: Instalar dependencias de Ansible
        run: pip install ansible boto3 botocore

      - name: Autorizar IP del Runner en el Bastion SG
        id: whitelist-ip
        run: |
          RUNNER_IP=$(curl -s https://checkip.amazonaws.com)
          echo "RUNNER_IP=$RUNNER_IP" >> $GITHUB_ENV
          echo "Inyectando la IP: $RUNNER_IP al Security Group..."
          aws ec2 authorize-security-group-ingress \
            --group-id ${{ secrets.BASTION_SG_ID }} \
            --protocol tcp \
            --port 22 \
            --cidr $RUNNER_IP/32

      - name: Obtener IP del Bastion
        run: |
          # Obtenemos la IP pública del Bastion
          BASTION_IP=$(aws ec2 describe-instances \
            --filters "Name=instance.group-id,Values=${{ secrets.BASTION_SG_ID }}" "Name=instance-state-name,Values=running" \
            --query "Reservations[0].Instances[0].PublicIpAddress" \
            --output text)
          
          # Validación por si AWS no devuelve nada
          if [ "$BASTION_IP" == "None" ] || [ -z "$BASTION_IP" ]; then
            echo "Error: No se encontró un Bastion corriendo con ese Security Group."
            exit 1
          fi
          
          echo "La IP actual del Bastion es: $BASTION_IP"
          echo "BASTION_IP=$BASTION_IP" >> $GITHUB_ENV

      - name: Ejecutar Ansible Playbook
        env:
          # Esta variable sobreescribe la configuración de tu ansible.cfg forzando la IP dinámica
          ANSIBLE_SSH_ARGS: "-o StrictHostKeyChecking=no -o ProxyCommand=\"ssh -W %h:%p -i ~/.ssh/p01-webha-key -o StrictHostKeyChecking=no ec2-user@${{ env.BASTION_IP }}\""
        run: ansible-playbook playbook.yml
        working-directory: ./ansible

      - name: Revocar IP del Runner del Bastion SG
        if: always()
        run: |
          echo "Removiendo la IP: ${{ env.RUNNER_IP }} del Security Group..."
          aws ec2 revoke-security-group-ingress \
            --group-id ${{ secrets.BASTION_SG_ID }} \
            --protocol tcp \
            --port 22 \
            --cidr ${{ env.RUNNER_IP }}/32